  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">チームサイト</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">

    <a th:href="@{/}" class="nav-link">メンバー一覧</a>

</nav>

<footer class="footer">

</footer>

</body>
</html>
